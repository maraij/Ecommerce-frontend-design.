<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ecommerce Homepage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header" id="main-header">
    <section class="container header-container">
      <img src="./assets/Gemini_Generated_Image_qalptgqalptgqalp.png" alt="Logo" class="logo">
      <nav class="nav-menu">
        <ul>
          <li><a href="index.html" class="nav-link active">Home</a></li>
          <li><a href="product.html" class="nav-link">Products</a></li>
          <li><a href="#" class="nav-link">Deals</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      <form class="search-form" onsubmit="return false;">
        <input type="search" id="headersearch" placeholder="Search for products">
        <button type="button" id="fakeSearchBtn" class="search-btn">🔍</button>
      </form>
    </section>
  </header>

  <section class="hero">
    <section class="hero-content fade-in">
      <h1>Latest trending<br>Electronic Items</h1>
      <p>Discover & shop the best picks!</p>
      <a href="products.html" class="cta-btn">Shop Now</a>
    </section>
  </section>

  <section class="categories">
    <h2>Categories</h2>
    <section class="categories-grid">
      <section class="category-card bounce">
        <img src="./assets/clothphoto-1558769132-cb1aea458c5e.avif" alt="Clothes">
        <span>Clothes</span>
      </section>
      <section class="category-card bounce">
        <img src="./assets/accessories.jpg" alt="Accessories">
        <span>Accessories</span>
      </section>
      <section class="category-card bounce">
        <img src="./assets/electronics.avif" alt="Electronics">
        <span>Electronics</span>
      </section>
      <section class="category-card bounce">
        <img src="./assets/sub_category-174021874143.jpg" alt="Beauty">
        <span>Beauty</span>
      </section>
    </section>
  </section>

  <footer class="site-footer">
    <section class="container footer-container">
      <section class="footer-branding">
        <p>&copy; 2026 Ecommerce. All rights reserved.</p>
      </section>
      <section class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Support</a>
      </section>
    </section>
  </footer>
  <script src="script.js"></script>
</body>
</html>
