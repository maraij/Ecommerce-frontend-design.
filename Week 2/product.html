<!DOCTYPE html>
<html>
<head>
 
  <title>Product Listing</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <!-- Header (reuse as above) -->
  <header class="site-header">
    <section class="container header-container">
      <img src="./assets/Screenshot 2026-05-30 165808.png" alt="Logo" class="logo">
      <nav class="nav-menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="#">Products</a></li>
          <li><a href="#">Deals</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <form class="search-form">
        <input type="search" placeholder="Search for products">
      </form>
    </section>
  </header>
  

<main class="product-page-main">

  <h2>All Products</h2>

  <section class="products-grid">

    <section class="product-card">
      <img src="./assets/iphone-14-pro-finish-select-202209-6-1inch-spaceblack.webp" alt="iPhone 14">
      <span class="prod-name">iPhone 14</span>
      <span class="prod-price">$999</span>
      <button class="buy-btn">Buy Now</button>
    </section>

    <section  class="product-card">
      <img src="./assets/image 86.png" alt="Headphones">
      <span class="prod-name">Sony Headphones</span>
      <span class="prod-price">$149</span>
      <button class="buy-btn">Buy Now</button>
    </section>

    <section class="product-card">
      <img src="./assets/8.png" alt="Smart Watch">
      <span class="prod-name">Smart Watch</span>
      <span class="prod-price">$199</span>
      <button class="buy-btn">Buy Now</button>
    </section>

    <section  class="product-card">
      <img src="./assets/trendy_shoes_men_best_jogger_shoes_by_calza.webp" alt="Shoes">
      <span class="prod-name"> Shoes</span>
      <span class="prod-price">$89</span>
      <button class="buy-btn">Buy Now</button>
    </section>

    <section class="product-card">
      <img src="./assets/laptop.avif" alt="Laptop">
      <span class="prod-name">Gaming Laptop</span>
      <span class="prod-price">$1299</span>
      <button class="buy-btn">Buy Now</button>
    </section>

    <section class="product-card">
      <img src="assets/1_4fbe31c2-5e99-4ab8-bdc7-bb7a2bb0ded8.webp" alt="Backpack">
      <span class="prod-name">Travel Backpack</span>
      <span class="prod-price">$59</span>
      <button class="buy-btn">Buy Now</button>
    </section>

  </section>

  <section class="pagination">
    <button class="load-more">Load More</button>
  </section>

</main>
  
  
  <footer class="site-footer">
    <section class="container footer-container">
      <section>© 2026 Ecommerce. All rights reserved.</section>
      <section class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Support</a>
      </section>
    </section>
  </footer>
</body>
</html>
