<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ecommerce Homepage</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
 
  <header class="site-header">
    <section class="container header-container">
      <img src="./assets/Screenshot 2026-05-30 165808.png" alt="Logo" class="logo">
      <nav class="nav-menu">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="product.html">Products</a></li>
          <li><a href="#">Deals</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <form class="search-form">
        <input type="search" placeholder="Search for products">
      </form>
    </section>
  </header>
  
  
  <section class="hero">
    <section class="hero-content">
      <h1>Latest trending<br>Electronic Items</h1>
      <p>Discover & shop the best picks!</p>
      <a href="product.html" class="cta-btn">Shop Now</a>
    </section>
    <img src="./assets/Banner-board-800x420 2.png" alt="Headphones" class="hero-img">
  </section>
  
  <section class="categories">
    <h2>Categories</h2>
    <section class="categories-grid">
      <section class="category-card">
        <img src="./assets/clothphoto-1558769132-cb1aea458c5e.avif" alt="Mobiles">
        <span>Clothes</span>
      </section>
      <section class="category-card">
        <img src="./assets/accessories.jpg" alt="Laptops">
        <span>Accessories</span>
      </section>
      <section class="category-card">
        <img src="./assets/electronics.avif" alt="Headphones">
        <span>Electronics</span>
      </section>
      <section class="category-card">
        <img src="./assets/sub_category-174021874143.jpg" alt="Cameras">
        <span>Beauty</span>
      </section>
    </section>
  </section>
  
  
<footer class="site-footer">

  <section class="container footer-container">

    <section class="footer-branding">
      <p>&copy; 2026 Ecommerce. All rights reserved.</p>
    </section>

    <section class="footer-links">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Support</a>
    </section>

  </section>

</footer>
</body>
</html>
